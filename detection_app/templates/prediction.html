{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Real-Time Detection</title>
    <style>
        body {
            background-color: #000;
            color: white;
            text-align: center;
            font-family: Arial, sans-serif;
        }

        .container {
            margin-top: 30px;
        }

        img {
            border: 5px solid red;
            border-radius: 10px;
        }

        .btn {
            margin-top: 20px;
            padding: 12px 25px;
            font-size: 16px;
            background-color: white;
            color: black;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }

        .btn:hover {
            background-color: #ddd;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Real-Time Violence Detection</h1>

        <img src="{% url 'video_feed' %}" width="900">

        <br>
        <a href="{% url 'home' %}">
            <button class="btn">Stop Detection</button>
        </a>
    </div>
</body>
</html>
